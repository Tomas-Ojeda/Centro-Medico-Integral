services:

  # ── Base de datos PostgreSQL ───────────────────────────────────
  db:
    image: postgres:16
    container_name: centromedico_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación Django ──────────────────────────────────────────
  web:
    build: .
    container_name: centromedico_web
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # ── Nginx (servidor web / proxy) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: centromedico_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

  # ── Backups automáticos ────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: centromedico_backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./docker/backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "chmod +x /backup.sh && crond -f -d 8"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
