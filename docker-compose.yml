services:

  # ── Base de datos PostgreSQL ───────────────────────────────────
  db:
    image: postgres:16
    container_name: centromedico_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 30

  # ── Aplicación Django ──────────────────────────────────────────
  web:
    build: .
    container_name: centromedico_web
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # ── Nginx (servidor web / proxy) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: centromedico_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

  # ── pgAdmin (gestor visual de PostgreSQL) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: centromedico_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db

  # ── Backups automáticos ────────────────────────────────────────
  backup:
    image: postgres:16
    container_name: centromedico_backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./docker/backups:/backups
      - ./docker/backup.sh:/backup.sh
    entrypoint: ["sh", "-c", "apt-get update && apt-get install -y cron && chmod +x /backup.sh && cron -f -L 15"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume: