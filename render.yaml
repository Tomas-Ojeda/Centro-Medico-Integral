services:
  - type: web
    name: centro-medico-integral
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn consultorio_salto.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "centro-medico-integral.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: centro-medico-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: centro-medico-db
    plan: free
    databaseName: centro_medico
    user: centro_medico_user
