services:
  - type: web
    name: centro-medico-integral
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn consultorio_salto.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "centro-medico-integral.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: centro-medico-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      # Para usar un Persistent Disk, descomentar el bloque "disk" de abajo
      # y también esta variable con la misma ruta de montaje.
      # - key: MEDIA_ROOT
      #   value: /var/data/media

    # ─── Persistent Disk para archivos de historia clínica ─────────
    # Requiere un plan pago de Render. Descomentar junto con MEDIA_ROOT.
    # Sin disco, los archivos se pierden al redeployar (el filesystem es efímero).
    # disk:
    #   name: centro-medico-media
    #   mountPath: /var/data/media
    #   sizeGB: 1

databases:
  - name: centro-medico-db
    plan: free
    databaseName: centro_medico
    user: centro_medico_user
